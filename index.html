<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テトリス</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: auto 240px;
      gap: 18px;
      align-items: start;
      padding: 20px;
    }

    .board-wrap {
      padding: 10px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    canvas {
      display: block;
      background: #020617;
      border-radius: 8px;
      image-rendering: pixelated;
    }

    .panel {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
      color: var(--muted);
    }

    .stat strong {
      color: var(--text);
      font-size: 1.2rem;
    }

    button {
      appearance: none;
      border: 1px solid #64748b;
      border-radius: 8px;
      padding: 8px 10px;
      background: #1d4ed8;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
    }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .panel { order: -1; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <canvas id="board" width="300" height="600" aria-label="テトリスボード"></canvas>
    </section>

    <aside class="panel">
      <h1 style="margin:0; font-size:1.2rem;">テトリス</h1>
      <div class="stat">スコア <strong id="score">0</strong></div>
      <div class="stat">レベル <strong id="level">1</strong></div>
      <div class="stat">消去ライン <strong id="lines">0</strong></div>
      <button id="restart">リスタート</button>
      <p class="hint">
        ← → : 移動<br />
        ↓ : ソフトドロップ<br />
        ↑ : 回転<br />
        Space : ハードドロップ<br />
        P : 一時停止
      </p>
      <p id="message" class="hint" style="color:#fbbf24;"></p>
    </aside>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const SHAPES = {
      I: [[1, 1, 1, 1]],
      O: [[1, 1], [1, 1]],
      T: [[0, 1, 0], [1, 1, 1]],
      S: [[0, 1, 1], [1, 1, 0]],
      Z: [[1, 1, 0], [0, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]],
    };

    const COLORS = {
      I: '#22d3ee',
      O: '#facc15',
      T: '#a855f7',
      S: '#4ade80',
      Z: '#f43f5e',
      J: '#3b82f6',
      L: '#fb923c',
    };

    const boardCanvas = document.getElementById('board');
    const ctx = boardCanvas.getContext('2d');
    ctx.scale(BLOCK, BLOCK);

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const linesEl = document.getElementById('lines');
    const messageEl = document.getElementById('message');

    const state = {
      board: createGrid(COLS, ROWS),
      piece: null,
      score: 0,
      lines: 0,
      level: 1,
      dropInterval: 900,
      dropCounter: 0,
      lastTime: 0,
      gameOver: false,
      paused: false,
      bag: [],
    };

    function createGrid(w, h) {
      return Array.from({ length: h }, () => Array(w).fill(null));
    }

    function shuffledBag() {
      const arr = Object.keys(SHAPES);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextType() {
      if (state.bag.length === 0) state.bag = shuffledBag();
      return state.bag.pop();
    }

    function spawnPiece() {
      const type = nextType();
      const shape = SHAPES[type].map((r) => [...r]);
      state.piece = {
        type,
        shape,
        color: COLORS[type],
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0,
      };

      if (collide(state.board, state.piece)) {
        state.gameOver = true;
        messageEl.textContent = 'ゲームオーバー。リスタートしてください。';
      }
    }

    function collide(board, piece) {
      return piece.shape.some((row, y) =>
        row.some((cell, x) => {
          if (!cell) return false;
          const px = piece.x + x;
          const py = piece.y + y;
          return px < 0 || px >= COLS || py >= ROWS || (py >= 0 && board[py][px]);
        })
      );
    }

    function merge(board, piece) {
      piece.shape.forEach((row, y) => {
        row.forEach((cell, x) => {
          if (!cell) return;
          const by = piece.y + y;
          const bx = piece.x + x;
          if (by >= 0) board[by][bx] = piece.color;
        });
      });
    }

    function rotate(matrix) {
      return matrix[0].map((_, i) => matrix.map((row) => row[i]).reverse());
    }

    function playerRotate() {
      if (state.gameOver || state.paused) return;
      const oldShape = state.piece.shape;
      const oldX = state.piece.x;
      state.piece.shape = rotate(state.piece.shape);

      let offset = 1;
      while (collide(state.board, state.piece)) {
        state.piece.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (Math.abs(offset) > state.piece.shape[0].length) {
          state.piece.shape = oldShape;
          state.piece.x = oldX;
          return;
        }
      }
    }

    function clearLines() {
      let cleared = 0;
      outer: for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (!state.board[y][x]) continue outer;
        }
        const row = state.board.splice(y, 1)[0].fill(null);
        state.board.unshift(row);
        cleared++;
        y++;
      }

      if (cleared) {
        state.lines += cleared;
        const gain = [0, 100, 300, 500, 800][cleared] * state.level;
        state.score += gain;
        const nextLevel = Math.floor(state.lines / 10) + 1;
        if (nextLevel !== state.level) {
          state.level = nextLevel;
          state.dropInterval = Math.max(120, 900 - (state.level - 1) * 80);
        }
      }
    }

    function softDrop() {
      if (state.gameOver || state.paused) return;
      state.piece.y++;
      if (collide(state.board, state.piece)) {
        state.piece.y--;
        lockPiece();
      } else {
        state.score += 1;
      }
      state.dropCounter = 0;
    }

    function hardDrop() {
      if (state.gameOver || state.paused) return;
      let dropped = 0;
      while (!collide(state.board, state.piece)) {
        state.piece.y++;
        dropped++;
      }
      state.piece.y--;
      state.score += (dropped - 1) * 2;
      lockPiece();
      state.dropCounter = 0;
    }

    function lockPiece() {
      merge(state.board, state.piece);
      clearLines();
      spawnPiece();
      updateStats();
    }

    function playerMove(dir) {
      if (state.gameOver || state.paused) return;
      state.piece.x += dir;
      if (collide(state.board, state.piece)) state.piece.x -= dir;
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
      ctx.strokeStyle = 'rgba(2,6,23,0.5)';
      ctx.lineWidth = 0.06;
      ctx.strokeRect(x, y, 1, 1);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, COLS, ROWS);

      state.board.forEach((row, y) => {
        row.forEach((color, x) => {
          if (color) drawCell(x, y, color);
        });
      });

      if (state.piece) {
        state.piece.shape.forEach((row, y) => {
          row.forEach((cell, x) => {
            if (cell) drawCell(state.piece.x + x, state.piece.y + y, state.piece.color);
          });
        });
      }
    }

    function updateStats() {
      scoreEl.textContent = state.score;
      linesEl.textContent = state.lines;
      levelEl.textContent = state.level;
    }

    function tick(time = 0) {
      const dt = time - state.lastTime;
      state.lastTime = time;

      if (!state.gameOver && !state.paused) {
        state.dropCounter += dt;
        if (state.dropCounter >= state.dropInterval) {
          state.piece.y++;
          if (collide(state.board, state.piece)) {
            state.piece.y--;
            lockPiece();
          }
          state.dropCounter = 0;
        }
      }

      draw();
      requestAnimationFrame(tick);
    }

    function reset() {
      state.board = createGrid(COLS, ROWS);
      state.piece = null;
      state.score = 0;
      state.lines = 0;
      state.level = 1;
      state.dropInterval = 900;
      state.dropCounter = 0;
      state.lastTime = 0;
      state.gameOver = false;
      state.paused = false;
      state.bag = [];
      messageEl.textContent = '';
      spawnPiece();
      updateStats();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') playerMove(-1);
      else if (e.key === 'ArrowRight') playerMove(1);
      else if (e.key === 'ArrowDown') softDrop();
      else if (e.key === 'ArrowUp') playerRotate();
      else if (e.code === 'Space') {
        e.preventDefault();
        hardDrop();
      } else if (e.key.toLowerCase() === 'p') {
        if (!state.gameOver) {
          state.paused = !state.paused;
          messageEl.textContent = state.paused ? '一時停止中 (Pで再開)' : '';
        }
      }
      updateStats();
    });

    document.getElementById('restart').addEventListener('click', reset);

    reset();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
